name: thu_tcbs
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          python -m venv /tmp/v6
          /tmp/v6/bin/pip install -q -U --extra-index-url https://vnstocks.com/api/packages "vnstock-oapi==0.1.0rc3"
      - env:
          TCBS_API_KEY: ${{ secrets.TCBS_API_KEY }}
        run: VNSTOCK_TELEMETRY=off DO_NOT_TRACK=1 /tmp/v6/bin/python thu_tcbs.py || true
      - if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A so_thu
          git commit -m "thu tcbs" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
