name: ngay_vn100
on:
  schedule:
    - cron: "0 11 * * 1-5"      # 18:00 gio Viet Nam
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: auto33
  cancel-in-progress: false
jobs:
  do_rong:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -U pandas vnstock vnai vnii --extra-index-url https://vnstocks.com/api/simple
      - name: VN100 do rong + khoi ngoai
        run: python ngay_vn100.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A data
          git commit -m "VN100 18h: do rong" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
  dong_tien:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: do_rong
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Giu nguyen ma thiet bi vnstock giua cac lan chay (khong ton them suat thiet bi)
        uses: actions/cache@v4
        with:
          path: ~/.vnstock
          key: vnstock-state-v2-${{ github.run_id }}
          restore-keys: |
            vnstock-state-v2-
            vnstock-state-40437374207
      - name: Dong tien lon (vnstock 5) - may sach, khong cai ban 4
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          python -m venv /tmp/v5
          /tmp/v5/bin/pip install -q -U pandas --extra-index-url https://vnstocks.com/api/packages vnstock
          VNSTOCK_TELEMETRY=off DO_NOT_TRACK=1 /tmp/v5/bin/python ngay_vn100_v5.py
          VNSTOCK_TELEMETRY=off DO_NOT_TRACK=1 /tmp/v5/bin/python roe_v5.py || true
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A data
          git commit -m "VN100 18h: dong tien lon" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
  quet_ma:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [do_rong, dong_tien]
    if: always() && needs.do_rong.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q pandas
      - name: Quet ma theo trang thai do rong (khong goi API)
        run: python quet_ma.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A data
          git commit -m "VN100 18h: quet ma" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
