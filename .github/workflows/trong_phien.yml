name: Kiem tra gio mua trong phien (tinh lai tu tep cong don)
# Khong goi SSI, khong can khoa: chi doc so/trong_phien_cong_don.csv (lich SSI hang ngay tu ghi them moi phien) roi tinh lai bang.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q pandas
      - name: Tinh lai bang
        run: python trong_phien.py
      - name: Luu ket qua
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A so
          git commit -m "Ket qua kiem tra trong phien" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
