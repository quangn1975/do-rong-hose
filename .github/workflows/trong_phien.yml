name: Kiem tra gio mua trong phien (SSI)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lay-so-ssi          # chung nhom voi lich SSI hang ngay: khong bao gio chay 2 viec SSI cung luc
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Cai bo cong cu chinh thuc cua SSI
        run: pip install -q pandas "ssi-sdk==3.3.2"
      - name: Chay
        env:
          SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
          SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}
        run: python trong_phien.py
      - name: Luu ket qua
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A so
          git commit -m "Ket qua kiem tra trong phien" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
