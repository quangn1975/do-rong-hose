name: ml_lenh_giay
on:
  schedule:
    - cron: "20 11 * * 1-5"     # 18:20 gio Viet Nam (sau khi san dong cua), thu 2 - thu 6
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: auto33
  cancel-in-progress: false
jobs:
  cham_diem:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -U pandas scikit-learn vnstock vnai vnii --extra-index-url https://vnstocks.com/api/simple
      - name: Cham diem hoc may + lenh giay (khong phai tien that)
        run: python ml_lenh_giay.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A data
          git commit -m "ML 18:20: cham diem va lenh giay" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
