name: vnstock4_thu
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas vnstock vnai vnii --extra-index-url https://vnstocks.com/api/simple
      - name: Thu
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          mkdir -p data
          cat > /tmp/t4.py <<'P'
          import os
          out=[]
          k=os.environ.get("VNSTOCK_API_KEY","")
          try:
              from vnstock import register_user
              register_user(api_key=k); out.append("dang ky OK")
          except Exception as e:
              out.append("dang ky loi "+str(e)[:100].replace(k,"***"))
          def show(t,f):
              out.append("##### "+t)
              try:
                  r=f(); out.append(str(list(r.columns))+"\n"+r.tail(6).to_string())
              except Exception as e:
                  out.append("LOI "+repr(e)[:300].replace(k,"***"))
          from vnstock import Vnstock, Market
          s=Vnstock().stock(symbol="HPG",source="VCI")
          show("company.trading_stats",lambda: s.company.trading_stats())
          show("quote.intraday",lambda: s.quote.intraday(page_size=20))
          out.append("Market: "+", ".join(n for n in dir(Market) if not n.startswith("_")))
          try:
              e=Market().equity("HPG")
              out.append("Market.equity: "+", ".join(n for n in dir(e) if not n.startswith("_")))
              for fn in ("foreign_flow","proprietary_flow"):
                  show("Market.equity."+fn,lambda fn=fn: getattr(e,fn)(limit=5))
          except Exception as ex:
              out.append("LOI Market "+repr(ex)[:300])
          open("data/vnstock4_thu.txt","w").write("\n".join(out))
          P
          python /tmp/t4.py > data/vnstock4_thu_log.txt 2>&1 || true
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A data
          git commit -m "vnstock4 thu" || exit 0
          git pull --rebase
          git push
