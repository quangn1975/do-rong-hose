name: Khung 1 gio 15 ma chot
on:
  schedule:
    - cron: "5,20,35,50 2-7 * * 1-5"   # 09:05 den 14:50 gio Viet Nam, 15 phut mot lan, thu 2 den thu 6
    - cron: "5 8 * * 1-5"              # 15:05 gio Viet Nam, sau khi dong cua
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: khung-1-gio
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -U pandas vnstock vnai --extra-index-url https://vnstocks.com/api/simple
      - run: python khung1h.py
      - name: Luu ket qua
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/khung_1_gio.csv
          git commit -m "Khung 1 gio $(date -u +%FT%H:%M)" || echo "Khong co thay doi"
          git pull --rebase
          git push
