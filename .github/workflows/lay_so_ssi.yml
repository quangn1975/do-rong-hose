name: Lay so SSI hang ngay
on:
  schedule:
    - cron: "23 8 * * 1-5"    # 15:23 gio Viet Nam, thu 2 - thu 6 (sau khi dong cua)
    - cron: "7 14 * * 1-5"    # 21:07 gio Viet Nam, chay lai de chac co so
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lay-so-ssi
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Cai bo cong cu chinh thuc cua SSI (khong dung vnstock)
        run: pip install -q pandas "ssi-sdk==3.3.2"
      - name: Lay so tu SSI
        env:
          SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
          SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}
        run: python lay_so_ssi.py
      - name: Luu ket qua
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A so
          git commit -m "So SSI hang ngay" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
