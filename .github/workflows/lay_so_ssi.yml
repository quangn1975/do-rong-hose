name: Lay so SSI hang ngay
on:
  schedule:
    - cron: "23 8 * * 1-5"    # 15:23 gio Viet Nam, thu 2 - thu 6 (sau khi dong cua)
    - cron: "7 14 * * 1-5"    # 21:07 gio Viet Nam, chay lai de chac co so
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lay-so-ssi
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Cai thu vien (khong dang nhap vnstock, khong ton thiet bi)
        run: |
          python -m venv /tmp/v6
          /tmp/v6/bin/pip install -q -U pandas --extra-index-url https://vnstocks.com/api/packages "vnstock==6.0.0rc4" "vnstock-oapi==0.1.0rc3"
      - name: Lay so tu SSI
        env:
          SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
          SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}
        run: VNSTOCK_TELEMETRY=off DO_NOT_TRACK=1 /tmp/v6/bin/python lay_so_ssi.py
      - name: Luu ket qua
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A so
          git commit -m "So SSI hang ngay" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
