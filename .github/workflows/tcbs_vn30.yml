name: TCBS - nhap Smart OTP lay so VN30
# Cach dung: sau 15:00, bam "Run workflow", go Smart OTP (app TCInvest), bam nut xanh. Chay 30-60 phut, khong can bat may tinh.
# Bao mat: xem dau tep tcbs_vn30.py. OTP khong nam trong bien moi truong, khong hien trong nhat ky.
on:
  workflow_dispatch:
    inputs:
      otp:
        description: "Smart OTP (lay tren app TCInvest, go xong bam Run workflow ngay)"
        required: false
        default: ""
permissions:
  contents: write            # chi du de luu tep so lieu vao kho; khong co quyen nao khac
concurrency:
  group: tcbs-vn30
  cancel-in-progress: false
jobs:
  run:
    # Chi chu kho bam chay, chi tu nhanh chinh: nguoi khac / nhanh khac khong dung duoc khoa TCBS
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      KHO_TAM: ${{ runner.temp }}/kho_tam
    steps:
      - name: Che ma OTP khoi nhat ky
        run: |
          OTP=$(jq -r '.inputs.otp // ""' "$GITHUB_EVENT_PATH" | tr -cd '0-9')
          if [ -n "$OTP" ]; then echo "::add-mask::$OTP"; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4, ghim dung ma phien ban
      - name: Cai cong cu (goi TCBS duoc ghim ma bam, khong the bi trao)
        run: |
          pip install -q --user "httpx>=0.27" "truststore>=0.10" "certifi>=2024.2.2" "platformdirs>=4" "keyring>=24" keyrings.alt
          printf '%s\n' '--extra-index-url https://vnstocks.com/api/packages' 'vnstock-oapi==0.1.0rc3 --hash=sha256:487acfdebc903592eeaec076ef3ded6eef8d260355b0dcb4ea040e563c0073b3' > "$RUNNER_TEMP/req.txt"
          pip install -q --user --no-deps --require-hashes -r "$RUNNER_TEMP/req.txt"
      - name: Mo phien TCBS va lay so (cham)
        env:
          TCBS_API_KEY: ${{ secrets.TCBS_API_KEY }}
          PYTHON_KEYRING_BACKEND: keyrings.alt.file.PlaintextKeyring
          XDG_DATA_HOME: ${{ runner.temp }}/kho_tam/data
          XDG_CONFIG_HOME: ${{ runner.temp }}/kho_tam/config
          XDG_STATE_HOME: ${{ runner.temp }}/kho_tam/state
          XDG_CACHE_HOME: ${{ runner.temp }}/kho_tam/cache
        run: |
          umask 077
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_STATE_HOME" "$XDG_CACHE_HOME"
          python3 tcbs_vn30.py
      - name: Xoa phien TCBS khoi may chu
        if: always()
        run: |
          if [ -d "$KHO_TAM" ]; then find "$KHO_TAM" -type f -exec shred -u {} + 2>/dev/null || true; rm -rf "$KHO_TAM"; fi
          rm -rf "$HOME/.local/share/python_keyring" "$RUNNER_TEMP/req.txt"
          echo "Da xoa phien."
      - name: Luu so lieu (chi thu muc so/tcbs)
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A so/tcbs
          git commit -m "So TCBS VN30" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
