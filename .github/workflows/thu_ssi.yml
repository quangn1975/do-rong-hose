name: thu_ssi
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q pandas "ssi-sdk==3.3.2"
      - env:
          SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
          SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}
        run: python chan_doan.py
      - if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A so_thu
          git commit -m "chan doan" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
