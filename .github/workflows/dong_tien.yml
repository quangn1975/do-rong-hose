name: dong_tien
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: auto33
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas vnstock vnai vnii --extra-index-url https://vnstocks.com/api/simple
      - name: Dang ky khoa
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          python - <<'PY'
          import os
          k=os.environ.get("VNSTOCK_API_KEY","")
          if k:
              try:
                  from vnstock import register_user
                  register_user(api_key=k)
              except Exception as e:
                  print("dang ky loi", type(e).__name__)
          PY
      - run: |
          python - > data/vci_intraday_src.txt 2>&1 <<'PY'
          import inspect
          from vnstock.explorer.vci import quote
          print(inspect.getsource(quote.Quote.intraday))
          from vnstock.api.quote import Quote
          print(inspect.signature(Quote.intraday))
          PY
          grep -c . data/vci_intraday_src.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A data
          git commit -m "dong tien test" || exit 0
          git pull --rebase
          git push
