name: thu_loc_v5
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Giu nguyen ma thiet bi vnstock
        uses: actions/cache@v4
        with:
          path: ~/.vnstock
          key: vnstock-state-v2-${{ github.run_id }}
          restore-keys: |
            vnstock-state-v2-
            vnstock-state-40437374207
      - env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          python -m venv /tmp/v5
          /tmp/v5/bin/pip install -q -U pandas --extra-index-url https://vnstocks.com/api/packages vnstock
          VNSTOCK_TELEMETRY=off DO_NOT_TRACK=1 /tmp/v5/bin/python thu_trades_v5.py || true
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A data
          git commit -m "thu loc v5" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
