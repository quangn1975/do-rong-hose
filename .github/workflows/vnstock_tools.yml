name: vnstock_tools
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m venv /tmp/v5 && /tmp/v5/bin/pip install -U pandas --extra-index-url https://vnstocks.com/api/packages vnstock
      - name: Thu dang nhap CI
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          mkdir -p data
          export VNSTOCK_TELEMETRY=off DO_NOT_TRACK=1
          V=/tmp/v5/bin
          {
            echo "### 1. chi dat bien moi truong, KHONG login: status"; $V/vnstock status
            echo "### 2. goi ham khong login"; $V/python -c "
          from vnstock import Market
          print(Market().equity('HPG').proprietary_flow(limit=1))" 2>&1 | tail -5
            echo "### 3. register bang CLI"; $V/vnstock register --help
            echo "### 4. doctor"; $V/vnstock doctor
          } 2>&1 | sed "s/$VNSTOCK_API_KEY/***/g" > data/vnstock5_ci.txt || true
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A data
          git commit -m "vnstock5 tools" || exit 0
          git pull --rebase
          git push
