name: vnstock_tools
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m venv /tmp/v5 && /tmp/v5/bin/pip install -U pandas --extra-index-url https://vnstocks.com/api/packages vnstock
      - name: Tim thu muc trang thai
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          mkdir -p data
          export VNSTOCK_TELEMETRY=off DO_NOT_TRACK=1
          V=/tmp/v5/bin
          {
            echo "### register"; echo "$VNSTOCK_API_KEY" | $V/vnstock register --stdin | tail -3
            echo "### env"; $V/vnstock env
            echo "### file moi trong HOME (chi ten)"; find "$HOME" -newermt "-10 minutes" -type f -not -path "*/tmp/*" -not -path "*/.cache/pip/*" -not -path "*/work/*" 2>/dev/null | head -40
            echo "### status"; $V/vnstock status | head -12
          } 2>&1 | sed "s/$VNSTOCK_API_KEY/***/g" > data/vnstock5_env.txt || true
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A data
          git commit -m "vnstock5 tools" || exit 0
          git pull --rebase
          git push
