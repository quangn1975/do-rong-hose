name: vnstock_tools
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m venv /tmp/v5 && /tmp/v5/bin/pip install -U pandas --extra-index-url https://vnstocks.com/api/packages vnstock
      - name: Thu du lieu
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          mkdir -p data
          export VNSTOCK_TELEMETRY=off DO_NOT_TRACK=1
          V=/tmp/v5/bin/vnstock
          { for f in foreign_flow proprietary_flow trade_history session_stats trades; do echo "##### DOC $f"; $V doc Market.equity.$f; done; } > data/vnstock5_doc.txt 2>&1 || true
          cat > /tmp/t.py <<'P'
          import os, vnstock, traceback
          try:
              vnstock.login(os.environ.get('VNSTOCK_API_KEY',''))
          except Exception as e:
              print('dk loi', type(e).__name__, str(e)[:150])
          from vnstock import Market
          out=[]
          for fn in ["foreign_flow","proprietary_flow","trade_history","session_stats"]:
              out.append("##### "+fn)
              try:
                  r=getattr(Market().equity("HPG"),fn)(limit=5)
                  out.append(str(getattr(r,"columns",""))+"\n"+str(r.tail(5).to_string() if hasattr(r,"tail") else r))
              except Exception as e:
                  out.append("LOI "+repr(e)[:500])
          open("data/vnstock5_thu.txt","w").write("\n".join(out))
          P
          /tmp/v5/bin/python /tmp/t.py > data/vnstock5_thu_log.txt 2>&1 || true
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A data
          git commit -m "vnstock5 tools" || exit 0
          git pull --rebase
          git push
