name: vnstock_tools
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m venv /tmp/v5 && /tmp/v5/bin/pip install -U pandas --extra-index-url https://vnstocks.com/api/packages vnstock
      - name: Liet ke API
        run: |
          mkdir -p data
          export VNSTOCK_TELEMETRY=off DO_NOT_TRACK=1
          { /tmp/v5/bin/vnstock tools Market.equity; echo ======; /tmp/v5/bin/vnstock tools Market.index; echo ======; /tmp/v5/bin/vnstock tools Reference.company; } > data/vnstock5_tools2.txt 2>&1 || true
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A data
          git commit -m "vnstock5 tools" || exit 0
          git pull --rebase
          git push
