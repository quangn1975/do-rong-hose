name: titan_thu
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: git clone --depth 1 https://github.com/KingDanny119/titan-vnstock-adaptive /tmp/titan
      - name: Soat ma nguon (khong chay, chi tim lenh la)
        run: |
          mkdir -p data
          {
            echo "== file =="; (cd /tmp/titan && find . -type f -not -path './.git/*' | sort)
            echo "== lenh nhay cam (ky vong chi co os.system clear) =="
            (cd /tmp/titan && grep -rnE "requests|urllib|socket|subprocess|eval\(|exec\(|os\.system|os\.environ|getenv|api_key|token|password|open\(|base64|http" --include=*.py --include=*.txt --include=*.json --include=*.yml --include=*.cfg . || echo "khong co")
          } > data/titan_soat.txt
      - run: pip install -U pandas numpy colorama tabulate vnstock vnai vnii --extra-index-url https://vnstocks.com/api/simple
      - name: Dang ky khoa vnstock
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python -c "import os; from vnstock import register_user; register_user(api_key=os.environ['VNSTOCK_API_KEY'])" > /dev/null 2>&1 || true
      - name: Quet thu 1 ma (FPT)
        working-directory: /tmp/titan
        run: timeout 300 python main.py --inspect FPT > "$GITHUB_WORKSPACE/data/titan_fpt.txt" 2>&1 || true
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A data
          git commit -m "titan: soat + quet thu" || exit 0
          git pull --rebase
          git push
