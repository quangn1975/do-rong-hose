name: auto33
on:
  schedule:
    - cron: "10 8 * * 1-5"
    - cron: "40 14 * * 1-5"
    - cron: "*/20 2-7 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -U pandas vnstock vnai --extra-index-url https://vnstocks.com/api/simple
      - run: python auto33.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A data
          git commit -m "auto33" || exit 0
          git pull --rebase
          git push
