name: auto33
on:
  schedule:
    - cron: "10 8 * * 1-5"
    - cron: "40 14 * * 1-5"
    - cron: "*/20 2-7 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -U pandas vnstock vnai vnii --extra-index-url https://vnstocks.com/api/simple
      - name: Dang ky khoa vnstock (neu co)
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          python - <<'PY'
          import os, inspect
          k = os.environ.get("VNSTOCK_API_KEY", "")
          print("co khoa:", bool(k), "do dai:", len(k))
          if k:
              try:
                  from vnstock import register_user
                  print("register_user", inspect.signature(register_user))
                  register_user(api_key=k)
                  print("dang ky OK")
              except Exception as e:
                  print("dang ky loi:", type(e).__name__, str(e)[:200].replace(k, "***"))
          PY
      - name: Chay auto33
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DELAY: "1.4"
        run: python auto33.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A data
          git commit -m "auto33" || exit 0
          git pull --rebase
          git push
