name: auto33
on:
  schedule:
    - cron: "10 8 * * 1-5"
    - cron: "40 14 * * 1-5"
    - cron: "*/20 2-7 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: auto33
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -U pandas vnstock vnai vnii --extra-index-url https://vnstocks.com/api/simple
      - name: Chay auto33
        run: python auto33.py
      - name: Giu nguyen ma thiet bi vnstock giua cac lan chay
        uses: actions/cache@v4
        with:
          path: ~/.vnstock
          key: vnstock-state-${{ github.run_id }}
          restore-keys: vnstock-state-
      - name: Ty le mua chu dong trong phien (vnstock 5) cho bo loc realtime
        continue-on-error: true
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          python -m venv /tmp/v5
          /tmp/v5/bin/pip install -q -U pandas --extra-index-url https://vnstocks.com/api/packages vnstock
          VNSTOCK_TELEMETRY=off DO_NOT_TRACK=1 /tmp/v5/bin/python mcd_v5.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A data
          git commit -m "auto33" || exit 0
          git pull --rebase
          git push
